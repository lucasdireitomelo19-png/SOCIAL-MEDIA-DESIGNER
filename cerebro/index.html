<title>Cérebro do Lucas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cérebro 3D em tela cheia; HUD no topo, legenda das áreas embaixo, painel do projeto flutuando à direita (folha inferior no celular). Visual escuro de propósito, tema único. */
:root{
  color-scheme:dark;
  --bg:#05070f; --panel:rgba(12,17,34,.82); --line:rgba(140,170,255,.18); --fg:#e8ecff; --muted:#8e98c2; --accent:#7fd8ff;
  --ok:#5ff0b0; --warn:#ffc35a; --idle:#7c86a8; --bad:#ff6b7a;
  --f-display:"Chakra Petch","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;overflow:hidden}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 40%,#0d1430 0%,var(--bg) 70%);color:var(--fg);font-family:var(--f-body);font-size:14px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);letter-spacing:.06em;text-transform:uppercase;margin:0;text-shadow:0 0 18px rgba(127,216,255,.45)}
.sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.right{display:grid;gap:6px;justify-items:end}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.live.on .dot{background:var(--ok);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(95,240,176,.6)}100%{box-shadow:0 0 0 8px transparent}}
.stats{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.legend{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.legend button{pointer-events:auto;font:inherit;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.legend button[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 14px -2px var(--c)}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend .hint{color:var(--muted);font-size:11.5px;align-self:center;width:100%;text-align:center}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:12px;font-weight:500;white-space:nowrap;padding:2px 8px;border-radius:6px;background:rgba(5,8,20,.65);border:1px solid var(--line);transform:translate(-50%,-150%);transition:opacity .2s;color:var(--fg)}
.lbl.area{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--c);border-color:transparent;background:none;text-shadow:0 0 10px var(--c)}
.lbl.hide{opacity:0}
.lbl.sel{border-color:var(--c);box-shadow:0 0 12px -2px var(--c)}
#tip{position:fixed;z-index:6;pointer-events:none;max-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px)}
#tip b{display:block;font-size:13px}
#tip span{color:var(--muted)}
aside{position:fixed;z-index:7;top:calc(86px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 170px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;backdrop-filter:blur(12px);box-shadow:0 0 40px -10px var(--c,#7fd8ff)}
@media (max-width:720px){aside{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:58%}}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--muted))}
aside h2{font-family:var(--f-display);font-size:24px;margin:2px 0 0;line-height:1.1;text-wrap:balance}
aside p{margin:0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid currentColor}
.st-ativo{color:var(--ok)}.st-pausado{color:var(--warn)}.st-ideia{color:var(--accent)}.st-concluido{color:var(--idle)}
.mono{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.next{border-left:2px solid var(--c);padding:8px 12px;background:rgba(127,216,255,.06);border-radius:0 8px 8px 0;line-height:1.45}
dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;margin:0;font-size:12.5px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-decoration:none}
.links a:hover{border-color:var(--accent)}
form{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:12px}
label{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:52px;resize:vertical}
button.b{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04101c}
button.g{background:transparent;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:12px;color:var(--muted)}
.danger{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
button.del{color:var(--bad);border-color:rgba(255,107,122,.45);justify-self:start}
button.del-yes{background:var(--bad);border-color:var(--bad);color:#1a0508}
.feed{display:grid;gap:8px}
.feed button{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.feed button:hover,.feed button:focus-visible{border-color:var(--c)}
.feed b{font-size:13px}.feed span{font-size:12px;color:var(--muted)}
#fallback[hidden]{display:none}
#fallback{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="tip" hidden></div>
<div id="fallback" hidden>Seu navegador não conseguiu abrir o 3D. Tente atualizar a página ou usar outro navegador.</div>

<div class="hud">
  <div>
    <h1>Cérebro</h1>
    <p class="sub">Arraste pra girar · role ou pince pra dar zoom · clique num neurônio</p>
  </div>
  <div class="right">
    <span class="live" id="live"><span class="dot"></span><span id="liveTxt">conectando…</span></span>
    <div class="stats" id="stats"></div>
  </div>
</div>
<aside id="panel"></aside>
<div class="legend" id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const AREAS = {
  "Canais Dark":      {hex:"#b48cff", dir:[-0.55, 0.55, 0.62], lobe:"lobo frontal esq."},
  "Conteúdo & Marca": {hex:"#ff7eb0", dir:[ 0.55, 0.55, 0.62], lobe:"lobo frontal dir."},
  "Brechós":          {hex:"#ffa25c", dir:[-0.95,-0.25, 0.05], lobe:"lobo temporal esq."},
  "Apps & Produtos":  {hex:"#46e0b0", dir:[ 0.95,-0.25, 0.05], lobe:"lobo temporal dir."},
  "Automação & IA":   {hex:"#6fb8ff", dir:[ 0.0, 0.85,-0.55], lobe:"lobo parietal"},
  "Outros":           {hex:"#c9cfe6", dir:[ 0.0,-0.55,-0.85], lobe:"cerebelo"}
};
const STATUS = {ativo:"Ativo", pausado:"Pausado", ideia:"Ideia", concluido:"Concluído"};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}};
const daysAgo = iso=>iso?Math.max(0,Math.floor((Date.now()-new Date(iso))/864e5)):null;
const whenTxt = iso=>{const d=daysAgo(iso);if(d===null)return"sem registro";if(d===0)return"hoje";if(d===1)return"ontem";if(d<30)return`há ${d} dias`;const m=Math.round(d/30);return m<12?`há ${m} ${m>1?"meses":"mês"}`:"há mais de 1 ano"};
const areaOf = p=>AREAS[p.area]?p.area:"Outros";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let projects=[], selected=null, focusArea=null, db=null, canWrite=false;

/* ---------- forma do cérebro ---------- */
function gyri(x,y,z){
  return 0.045*Math.sin(9*x+3*y)*Math.cos(8*z-2*y) + 0.03*Math.sin(15*y+7*z)*Math.sin(13*x) + 0.02*Math.cos(21*x-17*z+5*y);
}
function surf(dx,dy,dz){ // direção -> ponto na superfície do cérebro
  const L=Math.hypot(dx,dy,dz)||1; let x=dx/L,y=dy/L,z=dz/L;
  let r = 1 + gyri(x,y,z);
  if(y<-0.15) r *= 1 - (-0.15-y)*0.35;            // base achatada
  let px=x*r*1.0, py=y*r*0.82, pz=z*r*1.22;
  px += Math.sign(x||1)*0.05;                    // fissura entre hemisférios
  if(Math.abs(x)<0.08 && y>0) py -= 0.06;
  return new THREE.Vector3(px,py+0.08,pz);
}
function cerebellum(dx,dy,dz){
  const L=Math.hypot(dx,dy,dz)||1; const x=dx/L,y=dy/L,z=dz/L;
  const r=1+0.05*Math.sin(30*y);
  return new THREE.Vector3(x*0.52*r, y*0.3*r-0.62, z*0.38*r-0.78);
}
function rndDir(){ const u=Math.random()*2-1, t=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u); return [s*Math.cos(t),u,s*Math.sin(t)]; }

function glowTex(){
  const c=document.createElement("canvas"); c.width=c.height=64; const g=c.getContext("2d");
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.25,"rgba(255,255,255,.7)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}

let renderer, scene, camera, controls, brain, nodeGroup, linkGroup, pulses=[], nodeMeshes=[], areaHubs={}, labels=[];
const tex = window.THREE ? glowTex() : null;

function init(){
  if(!window.THREE){ $("#fallback").hidden=false; return false; }
  try{ renderer = new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){ $("#fallback").hidden=false; return false; }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  $("#stage").appendChild(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42,1,0.1,100);
  camera.position.set(2.6,1.2,3.4);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.07; controls.minDistance=1.8; controls.maxDistance=8; controls.enablePan=false;
  controls.autoRotate=!reduce; controls.autoRotateSpeed=0.55;
  let idle; controls.addEventListener("start",()=>{controls.autoRotate=false;clearTimeout(idle)});
  controls.addEventListener("end",()=>{clearTimeout(idle);idle=setTimeout(()=>{if(!reduce&&!selected)controls.autoRotate=true},6000)});

  brain = new THREE.Group(); scene.add(brain);
  // nuvem de neurônios
  const N=9000, pos=new Float32Array(N*3), col=new Float32Array(N*3), cA=new THREE.Color("#5b7cff"), cB=new THREE.Color("#8ff0ff"), tmp=new THREE.Color();
  const pts=[];
  for(let i=0;i<N;i++){
    const d=rndDir(); const inside = Math.random()<0.18 ? 0.55+Math.random()*0.4 : 1;
    let p = i<N*0.88 ? surf(...d) : cerebellum(...d);
    p.multiplyScalar(inside===1?1:inside);
    pos.set([p.x,p.y,p.z],i*3); pts.push(p);
    tmp.copy(cA).lerp(cB, Math.min(1,Math.max(0,(p.y+0.6)/1.4))); col.set([tmp.r,tmp.g,tmp.b],i*3);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3)); g.setAttribute("color",new THREE.BufferAttribute(col,3));
  brain.add(new THREE.Points(g,new THREE.PointsMaterial({size:0.022,map:tex,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending})));
  // teia neural: liga vizinhos
  const seg=[]; for(let k=0;k<1400;k++){ const a=pts[(Math.random()*pts.length)|0]; let best=null,bd=1e9; for(let t=0;t<40;t++){const b=pts[(Math.random()*pts.length)|0]; const dd=a.distanceToSquared(b); if(dd>0.002&&dd<bd){bd=dd;best=b}} if(best&&bd<0.03) seg.push(a.x,a.y,a.z,best.x,best.y,best.z); }
  const lg=new THREE.BufferGeometry(); lg.setAttribute("position",new THREE.Float32BufferAttribute(seg,3));
  brain.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:"#4f7dff",transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false})));
  // tronco
  const stem=[]; for(let i=0;i<500;i++){ const t=Math.random(), a=Math.random()*6.28, r=0.12*(1-t*0.3); stem.push(Math.cos(a)*r, -0.35-t*0.75, -0.35-t*0.1+Math.sin(a)*r); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute("position",new THREE.Float32BufferAttribute(stem,3));
  brain.add(new THREE.Points(sg,new THREE.PointsMaterial({size:0.02,map:tex,color:"#3f5fd0",transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending})));
  // núcleo
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:"#7fd8ff",transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  core.scale.setScalar(0.5); core.position.set(0,0.05,0); brain.add(core); brain.userData.core=core;

  linkGroup=new THREE.Group(); nodeGroup=new THREE.Group(); brain.add(linkGroup); brain.add(nodeGroup);

  addEventListener("resize",resize); resize();
  setupPointer();
  animate();
  return true;
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.fov = w<720?55:42; camera.updateProjectionMatrix(); }

/* ---------- projetos como neurônios ---------- */
function groups(){ const g={}; projects.forEach(p=>{(g[areaOf(p)]=g[areaOf(p)]||[]).push(p)}); return g; }
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}

function buildNodes(){
  if(!nodeGroup) return;
  [...nodeGroup.children].forEach(c=>nodeGroup.remove(c)); [...linkGroup.children].forEach(c=>linkGroup.remove(c));
  nodeMeshes=[]; pulses=[]; areaHubs={}; $("#labels").innerHTML=""; labels=[];
  const coreP=new THREE.Vector3(0,0.05,0);
  Object.entries(groups()).forEach(([area,list])=>{
    const A=AREAS[area], color=new THREE.Color(A.hex);
    const surfP=surf(...A.dir), hub=surfP.clone().multiplyScalar(0.62);
    areaHubs[area]={pos:surfP.clone(), color};
    const hs=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
    hs.scale.setScalar(0.28); hs.position.copy(hub); nodeGroup.add(hs);
    addCurve(coreP,hub,color,0.22,true);
    addLabel({area, pos:hub, cls:"area", text:A.lobe.replace(/^lobo /,"")==="cerebelo"?area:area});
    list.forEach((p,j)=>{
      const h=hash(p.id), n=list.length;
      const ang=(j/n)*Math.PI*2 + (h%100)/100, spread = 0.18 + 0.05*Math.min(n,5);
      const base=new THREE.Vector3(...A.dir).normalize();
      const t1=new THREE.Vector3().crossVectors(base,new THREE.Vector3(0,1,0.001)).normalize(), t2=new THREE.Vector3().crossVectors(base,t1).normalize();
      const dir=base.clone().add(t1.multiplyScalar(Math.cos(ang)*spread*(n>1?1:0))).add(t2.multiplyScalar(Math.sin(ang)*spread*(n>1?1:0)));
      const pos=surf(dir.x,dir.y,dir.z).multiplyScalar(1.04);
      const d=daysAgo(p.last_activity), hot=d!==null&&d<=7, faded=p.status==="pausado"||p.status==="concluido";
      const c = faded ? color.clone().lerp(new THREE.Color("#7c86a8"),0.55) : color;
      const size = hot?0.2: d!==null&&d<=30?0.15:0.12;
      const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:c,transparent:true,opacity:faded?.55:1,blending:THREE.AdditiveBlending,depthWrite:false}));
      glow.scale.setScalar(size*(hot?1.6:1.3)); glow.position.copy(pos); nodeGroup.add(glow);
      const m=new THREE.Mesh(new THREE.SphereGeometry(size*0.22,16,16),new THREE.MeshBasicMaterial({color:new THREE.Color("#ffffff").lerp(c,0.35)}));
      m.position.copy(pos); m.userData={id:p.id,glow,hot,base:size*(hot?1.6:1.3),phase:Math.random()*6}; nodeGroup.add(m); nodeMeshes.push(m);
      addCurve(hub,pos,c,faded?0.18:0.4,hot||!faded);
      addLabel({id:p.id, pos, cls:"", text:p.name, color:A.hex});
    });
  });
  applyFocus();
}
function addCurve(a,b,color,op,pulse){
  const mid=a.clone().add(b).multiplyScalar(0.5); mid.multiplyScalar(1.12);
  const curve=new THREE.QuadraticBezierCurve3(a.clone(),mid,b.clone());
  const geo=new THREE.BufferGeometry().setFromPoints(curve.getPoints(32));
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
  line.userData.op=op; linkGroup.add(line);
  if(pulse && !reduce){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.scale.setScalar(0.07); linkGroup.add(s); pulses.push({s,curve,t:Math.random(),v:0.25+Math.random()*0.35});
  }
}
function addLabel(o){
  const el=document.createElement("div"); el.className="lbl "+o.cls; el.textContent=o.text;
  el.style.setProperty("--c", o.color || (AREAS[o.area]&&AREAS[o.area].hex));
  $("#labels").appendChild(el); labels.push({...o, el});
}

/* ---------- interação ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let hover=null, downAt=null;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect(); mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera); ray.params.Mesh={threshold:0.05};
  const hits=ray.intersectObjects(nodeMeshes,false);
  if(hits.length) return hits[0].object;
  // tolerância: neurônio mais próximo na tela
  let best=null,bd=22*22; const v=new THREE.Vector3();
  nodeMeshes.forEach(m=>{ m.getWorldPosition(v); v.project(camera); const x=(v.x+1)/2*r.width, y=(1-v.y)/2*r.height; const d=(x-(ev.clientX-r.left))**2+(y-(ev.clientY-r.top))**2; if(d<bd&&v.z<1){bd=d;best=m} });
  return best;
}
function setupPointer(){
  const c=renderer.domElement;
  c.addEventListener("pointermove",ev=>{
    const m=pick(ev); hover=m; c.style.cursor=m?"pointer":"grab";
    const tip=$("#tip");
    if(m && ev.pointerType==="mouse"){ const p=projects.find(x=>x.id===m.userData.id); if(p){ tip.innerHTML=`<b>${esc(p.name)}</b><span>${esc(STATUS[p.status]||"")} · ${whenTxt(p.last_activity)}</span>`; tip.hidden=false; tip.style.left=(ev.clientX+14)+"px"; tip.style.top=(ev.clientY+14)+"px"; } }
    else tip.hidden=true;
  });
  c.addEventListener("pointerdown",ev=>{downAt=[ev.clientX,ev.clientY]});
  c.addEventListener("pointerup",ev=>{
    if(!downAt||Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1])>6) return;
    const m=pick(ev); if(m) select(m.userData.id); else if(selected){ select(null); }
  });
}
let flyTo=null;
function select(id){
  selected=id; controls.autoRotate=false;
  if(id){ const m=nodeMeshes.find(x=>x.userData.id===id); if(m){ const w=m.getWorldPosition(new THREE.Vector3()); flyTo={target:w.clone().multiplyScalar(0.35), cam:w.clone().normalize().multiplyScalar(3.0).add(new THREE.Vector3(0,0.3,0))}; } }
  else flyTo={target:new THREE.Vector3(), cam:camera.position.clone().normalize().multiplyScalar(4.4)};
  applyFocus(); renderPanel();
}
function focusOn(area){
  focusArea = focusArea===area?null:area; selected=null;
  if(focusArea && areaHubs[focusArea]){ const w=areaHubs[focusArea].pos.clone().applyMatrix4(brain.matrixWorld); flyTo={target:w.clone().multiplyScalar(0.3), cam:w.clone().normalize().multiplyScalar(3.3).add(new THREE.Vector3(0,0.3,0))}; controls.autoRotate=false; }
  applyFocus(); renderLegend(); renderPanel();
}
function applyFocus(){
  const selArea = selected ? areaOf(projects.find(p=>p.id===selected)||{}) : focusArea;
  nodeMeshes.forEach(m=>{ const p=projects.find(x=>x.id===m.userData.id); const on=!selArea||areaOf(p)===selArea; m.material.opacity=on?1:.2; m.material.transparent=true; m.userData.glow.material.opacity=on?(p.status==="pausado"||p.status==="concluido"?.55:1):.12; });
  labels.forEach(l=>{ l.el.classList.toggle("sel", l.id && l.id===selected); });
}

/* ---------- loop ---------- */
const clock=window.THREE?new THREE.Clock():null; const v3=window.THREE?new THREE.Vector3():null;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(flyTo){ controls.target.lerp(flyTo.target,0.08); camera.position.lerp(flyTo.cam,0.06); if(camera.position.distanceTo(flyTo.cam)<0.02) flyTo=null; }
  controls.update();
  pulses.forEach(p=>{ p.t=(p.t+dt*p.v)%1; p.s.position.copy(p.curve.getPoint(p.t)); });
  nodeMeshes.forEach(m=>{ const u=m.userData; const k = u.id===selected?1.8:(m===hover?1.4:1); const beat = u.hot&&!reduce ? 1+0.18*Math.sin(t*4+u.phase) : 1; u.glow.scale.setScalar(u.base*k*beat); });
  if(brain.userData.core && !reduce) brain.userData.core.material.opacity = .45+.15*Math.sin(t*1.6);
  renderer.render(scene,camera);
  // rótulos
  const w=innerWidth,h=innerHeight, camDist=camera.position.length();
  const selArea = selected ? areaOf(projects.find(p=>p.id===selected)||{}) : focusArea;
  labels.forEach(l=>{
    v3.copy(l.pos).applyMatrix4(brain.matrixWorld);
    const facing = v3.clone().normalize().dot(camera.position.clone().normalize());
    v3.project(camera);
    const show = v3.z<1 && (l.cls==="area" ? facing>-0.2 : (facing>0.15 && (camDist<3.6 || l.id===selected || (selArea && areaOf(projects.find(p=>p.id===l.id)||{})===selArea) || (hover&&hover.userData.id===l.id))));
    l.el.classList.toggle("hide",!show);
    if(show) l.el.style.transform=`translate(${(v3.x+1)/2*w}px,${(1-v3.y)/2*h}px) translate(-50%,-150%)`;
  });
}

/* ---------- UI ---------- */
function renderStats(){
  const act=projects.filter(p=>p.status==="ativo").length, wk=projects.filter(p=>{const d=daysAgo(p.last_activity);return d!==null&&d<=7}).length;
  $("#stats").innerHTML=`<span><b>${projects.length}</b> neurônios</span><span><b>${act}</b> ativos</span><span><b>${wk}</b> pulsando esta semana</span>`;
}
function renderLegend(){
  const g=groups();
  $("#legend").innerHTML = Object.keys(AREAS).filter(a=>g[a]).map(a=>`<button type="button" data-area="${esc(a)}" aria-pressed="${focusArea===a}" style="--c:${AREAS[a].hex}"><i></i>${esc(a)} · ${g[a].length}</button>`).join("") + `<span class="hint">brilho pulsando = mexido nos últimos 7 dias · neurônio apagado = pausado</span>`;
}
function renderPanel(){
  const el=$("#panel"); const p=projects.find(x=>x.id===selected);
  if(!p){
    const pool = focusArea ? projects.filter(x=>areaOf(x)===focusArea) : projects;
    const recent=[...pool].sort((a,b)=>(b.last_activity||"").localeCompare(a.last_activity||"")).slice(0,focusArea?12:5);
    el.style.setProperty("--c", focusArea?AREAS[focusArea].hex:"#7fd8ff");
    el.hidden = !projects.length && !canWrite;
    el.innerHTML=`<div><div class="eyebrow">${focusArea?esc(AREAS[focusArea].lobe):"Atividade recente"}</div><h2>${focusArea?esc(focusArea):"O que está vivo agora"}</h2></div>
      <div class="feed">${recent.map(r=>`<button type="button" data-id="${esc(r.id)}" style="--c:${AREAS[areaOf(r)].hex}"><b>${esc(r.name)}</b><span>${esc(r.last_note||r.desc)} · ${whenTxt(r.last_activity)}</span></button>`).join("") || `<p class="msg">Nenhum projeto ainda.</p>`}</div>
      ${canWrite?`<form id="add"><div class="eyebrow">Novo neurônio</div>
        <label for="n-name">Nome do projeto<input id="n-name" required placeholder="Ex.: Canal de curiosidades"></label>
        <label for="n-area">Área<select id="n-area">${Object.keys(AREAS).map(a=>`<option${a===focusArea?" selected":""}>${esc(a)}</option>`).join("")}</select></label>
        <label for="n-desc">Do que se trata<textarea id="n-desc"></textarea></label>
        <div class="row"><button class="b" type="submit">Adicionar ao cérebro</button><span class="msg" id="n-msg"></span></div></form>`:""}`;
    const f=$("#add"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const name=$("#n-name").value.trim(); if(!name)return;
      const id=name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||("p"+Date.now());
      $("#n-msg").textContent="Adicionando…";
      try{ await db.doc("projects/"+id).set({name,area:$("#n-area").value,desc:$("#n-desc").value.trim(),status:"ideia",last_activity:new Date().toISOString()}); selected=id; }catch{ $("#n-msg").textContent="Não deu pra adicionar."; } };
    return;
  }
  el.hidden=false;
  const A=AREAS[areaOf(p)]; el.style.setProperty("--c",A.hex);
  const links=[...(p.repo?[{label:"GitHub",url:"https://github.com/"+p.repo}]:[]),...(Array.isArray(p.links)?p.links:[])].map(l=>{const u=safeUrl(l.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`:""}).join("");
  el.innerHTML=`<div><div class="eyebrow">${esc(areaOf(p))} · ${esc(A.lobe)}</div><h2>${esc(p.name)}</h2></div>
    <div class="row"><span class="pill st-${esc(p.status)}">${esc(STATUS[p.status]||p.status)}</span><span class="mono">${whenTxt(p.last_activity)}</span></div>
    <p>${esc(p.desc)}</p>
    ${p.next_step?`<div class="next"><div class="eyebrow">Próximo passo</div>${esc(p.next_step)}</div>`:""}
    <dl>${p.last_note?`<dt>Último feito</dt><dd>${esc(p.last_note)}</dd>`:""}${p.stack?`<dt>Stack</dt><dd>${esc(p.stack)}</dd>`:""}${p.repo?`<dt>Repositório</dt><dd class="mono">${esc(p.repo)}</dd>`:""}</dl>
    ${links?`<div class="links">${links}</div>`:""}
    ${canWrite?`<form id="edit"><div class="eyebrow">Atualizar</div>
      <label for="f-status">Status<select id="f-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${p.status===k?" selected":""}>${v}</option>`).join("")}</select></label>
      <label for="f-note">O que você fez<input id="f-note" value="${esc(p.last_note)}" placeholder="Ex.: publiquei o vídeo 3"></label>
      <label for="f-next">Próximo passo<textarea id="f-next">${esc(p.next_step)}</textarea></label>
      <div class="row"><button class="b" type="submit">Salvar</button><button class="b g" type="button" id="close">Fechar</button><span class="msg" id="f-msg"></span></div>
      <div class="danger" id="del-zone"><button class="b g del" type="button" id="del">Apagar do cérebro</button></div></form>`
      :`<div class="row"><button class="b g" type="button" id="close">Fechar</button></div>`}`;
  $("#close").onclick=()=>select(null);
  const dz=$("#del-zone");
  if(dz){
    const ask=()=>{ dz.innerHTML=`<span class="msg">Apagar <b>${esc(p.name)}</b> de vez? Não dá pra desfazer.</span><div class="row"><button class="b del-yes" type="button" id="del-yes">Sim, apagar</button><button class="b g" type="button" id="del-no">Cancelar</button></div>`;
      $("#del-no").onclick=()=>{ dz.innerHTML=`<button class="b g del" type="button" id="del">Apagar do cérebro</button>`; $("#del").onclick=ask; };
      $("#del-yes").onclick=async()=>{ const b=$("#del-yes"); b.disabled=true; b.textContent="Apagando…";
        try{ await db.doc("projects/"+p.id).delete(); select(null); }
        catch(err){ dz.innerHTML=`<span class="msg">${err&&err.code==="permission_denied"?"Só quem edita o cérebro pode apagar.":"Não apagou. Tente de novo."}</span>`; } };
      $("#del-yes").focus(); };
    $("#del").onclick=ask;
  }
  const f=$("#edit"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const m=$("#f-msg"); m.textContent="Salvando…";
    try{ await db.doc("projects/"+p.id).update({status:$("#f-status").value,last_note:$("#f-note").value.trim(),next_step:$("#f-next").value.trim(),last_activity:new Date().toISOString()}); m.textContent="Salvo"; }
    catch(err){ m.textContent=err&&err.code==="permission_denied"?"Só quem edita o cérebro pode salvar.":"Não salvou. Tente de novo."; } };
}
document.addEventListener("click",e=>{
  const a=e.target.closest(".legend [data-area]"); if(a){ focusOn(a.dataset.area); return; }
  const b=e.target.closest(".feed [data-id]"); if(b){ select(b.dataset.id); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ focusArea=null; select(null); renderLegend(); } });

function refresh(){ renderStats(); renderLegend(); buildNodes(); renderPanel(); }
function setLive(on,txt){ $("#live").classList.toggle("on",on); $("#liveTxt").textContent=txt; }

const ok = init();
refresh();
(async()=>{
  const timer=setTimeout(()=>setLive(false,"sem conexão com o banco"),10000);
  const c=window.claude; db=c?await c.use("db"):null; const user=c?await c.use("user"):null;
  if(!db){ clearTimeout(timer); setLive(false,"entre no claude.ai pra ver ao vivo"); return; }
  canWrite = user ? await user.canEdit() : false;
  db.collection("projects").onSnapshot(snap=>{
    clearTimeout(timer);
    projects=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
    if(selected && !projects.some(p=>p.id===selected)) selected=null;
    setLive(true,"ao vivo · "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    refresh();
  },()=>{ clearTimeout(timer); setLive(false,"conexão perdida, recarregue a página"); });
})();
</script>
