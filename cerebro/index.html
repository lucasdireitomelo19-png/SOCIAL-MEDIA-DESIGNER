<title>Cérebro do Lucas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cérebro 3D em tela cheia; HUD no topo; painel do projeto flutuando à direita; doca do Jarvis (legendas da conversa, orbe de voz, campo de texto, áreas) embaixo. Tema escuro único, de propósito. */
:root{
  color-scheme:dark;
  --bg:#05070f; --panel:rgba(12,17,34,.82); --line:rgba(140,170,255,.18); --fg:#e8ecff; --muted:#8e98c2; --accent:#7fd8ff;
  --ok:#5ff0b0; --warn:#ffc35a; --idle:#7c86a8; --bad:#ff6b7a; --think:#b48cff;
  --f-display:"Chakra Petch","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;overflow:hidden}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 40%,#0d1430 0%,var(--bg) 70%);color:var(--fg);font-family:var(--f-body);font-size:14px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);letter-spacing:.06em;text-transform:uppercase;margin:0;text-shadow:0 0 18px rgba(127,216,255,.45)}
.sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.right{display:grid;gap:6px;justify-items:end}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);backdrop-filter:blur(8px)}
button.chip{cursor:pointer;font-family:var(--f-mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.live.on .dot{background:var(--ok);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(95,240,176,.6)}100%{box-shadow:0 0 0 8px transparent}}
.stats{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:12px;font-weight:500;white-space:nowrap;padding:2px 8px;border-radius:6px;background:rgba(5,8,20,.65);border:1px solid var(--line);transition:opacity .25s;color:var(--fg);will-change:transform}
.lbl.area{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--c);border-color:transparent;background:none;text-shadow:0 0 10px var(--c)}
.lbl.hide{opacity:0}
.lbl.sel{border-color:var(--c);box-shadow:0 0 12px -2px var(--c)}
#tip{position:fixed;z-index:6;pointer-events:none;max-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px)}
#tip b{display:block;font-size:13px}
#tip span{color:var(--muted)}

aside{position:fixed;z-index:7;top:calc(86px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 330px);min-height:120px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start;backdrop-filter:blur(12px);box-shadow:0 0 40px -10px var(--c,#7fd8ff)}
@media (max-width:720px){aside{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;top:calc(104px + env(safe-area-inset-top,0px));max-height:34%;padding:14px}.sub{display:none}}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--muted))}
aside h2{font-family:var(--f-display);font-size:24px;margin:2px 0 0;line-height:1.1;text-wrap:balance}
aside p{margin:0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid currentColor}
.st-ativo{color:var(--ok)}.st-pausado{color:var(--warn)}.st-ideia{color:var(--accent)}.st-concluido{color:var(--idle)}
.mono{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.next{border-left:2px solid var(--c);padding:8px 12px;background:rgba(127,216,255,.06);border-radius:0 8px 8px 0;line-height:1.45}
dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;margin:0;font-size:12.5px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-decoration:none}
.links a:hover{border-color:var(--accent)}
form.f{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:12px}
label{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:52px;resize:vertical}
button.b{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04101c}
button.g{background:transparent;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:12px;color:var(--muted)}
.danger{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
button.del{color:var(--bad);border-color:rgba(255,107,122,.45);justify-self:start}
button.del-yes{background:var(--bad);border-color:var(--bad);color:#1a0508}
.feed{display:grid;gap:8px}
.feed button{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.feed button:hover,.feed button:focus-visible{border-color:var(--c)}
.feed b{font-size:13px}.feed span{font-size:12px;color:var(--muted)}

/* Doca do Jarvis */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;justify-items:center;gap:10px;pointer-events:none;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock>*{pointer-events:auto}
.talk{display:grid;gap:4px;justify-items:center;text-align:center;max-width:min(680px,100%);min-height:1px}
#said{font-size:13px;color:var(--muted);font-style:italic;min-height:0}
#answer{font-size:clamp(15px,1.8vw,18px);line-height:1.45;color:var(--fg);text-shadow:0 1px 12px rgba(0,0,0,.9);text-wrap:balance;max-height:7.5em;overflow:auto}
.jrow{display:flex;align-items:center;gap:12px;width:min(620px,100%)}
.orb{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid rgba(127,216,255,.5);cursor:pointer;position:relative;background:radial-gradient(circle at 50% 40%,rgba(127,216,255,.55),rgba(30,60,140,.35) 60%,rgba(5,10,25,.8));box-shadow:0 0 24px -4px var(--mc,var(--accent)),inset 0 0 18px rgba(127,216,255,.35);transition:transform .2s}
.orb:hover{transform:scale(1.05)}
.orb::before,.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--mc,var(--accent));opacity:.35}
.orb svg{width:24px;height:24px;position:absolute;inset:0;margin:auto;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round}
body[data-mood="listening"]{--mc:var(--accent)}
body[data-mood="thinking"]{--mc:var(--think)}
body[data-mood="speaking"]{--mc:var(--ok)}
body[data-mood="listening"] .orb::before{animation:ring 1.4s ease-out infinite}
body[data-mood="listening"] .orb::after{animation:ring 1.4s .7s ease-out infinite}
body[data-mood="thinking"] .orb::before{border-style:dashed;animation:spin 1.2s linear infinite;opacity:.8}
body[data-mood="speaking"] .orb{animation:talk .45s ease-in-out infinite alternate}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{to{box-shadow:0 0 44px 2px var(--mc),inset 0 0 22px rgba(95,240,176,.45)}}
#ask{flex:1;display:flex;gap:8px;min-width:0}
#askIn{background:var(--panel);backdrop-filter:blur(8px);border-radius:999px;padding:10px 16px;font-size:14px}
#ask .b{border-radius:999px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.legend button{font:inherit;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.legend button[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 14px -2px var(--c)}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
@media (max-width:720px){.legend{display:none}.orb{width:56px;height:56px}#ask .b{display:none}}
@media (prefers-reduced-motion:reduce){.orb::before,.orb::after,.orb{animation:none!important}}
#fallback[hidden]{display:none}
#fallback{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="tip" hidden></div>
<div id="fallback" hidden>Seu navegador não conseguiu abrir o 3D. Tente atualizar a página ou usar outro navegador.</div>

<div class="hud">
  <div>
    <h1>Cérebro</h1>
    <p class="sub">Arraste pra girar · pince ou role pra zoom · toque no orbe e fale</p>
  </div>
  <div class="right">
    <div class="row">
      <button class="chip" type="button" id="mute" aria-pressed="false">voz: ligada</button>
      <span class="chip live" id="live"><span class="dot"></span><span id="liveTxt">conectando…</span></span>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<aside id="panel"></aside>

<div class="dock">
  <div class="talk" aria-live="polite">
    <div id="said"></div>
    <div id="answer">Toque no orbe e fale. Ex.: “o que tá parado há mais tempo?”</div>
  </div>
  <div class="jrow">
    <button class="orb" id="orb" type="button" aria-label="Falar com o Jarvis (atalho: espaço)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <form id="ask"><input id="askIn" autocomplete="off" placeholder="Ou digite um comando…" aria-label="Comando para o Jarvis"><button class="b" type="submit">Enviar</button></form>
  </div>
  <div class="legend" id="legend"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const AREAS = {
  "Canais Dark":      {hex:"#b48cff", dir:[-0.55, 0.55, 0.62], lobe:"lobo frontal esq."},
  "Conteúdo & Marca": {hex:"#ff7eb0", dir:[ 0.55, 0.55, 0.62], lobe:"lobo frontal dir."},
  "Brechós":          {hex:"#ffa25c", dir:[-0.95,-0.25, 0.05], lobe:"lobo temporal esq."},
  "Apps & Produtos":  {hex:"#46e0b0", dir:[ 0.95,-0.25, 0.05], lobe:"lobo temporal dir."},
  "Automação & IA":   {hex:"#6fb8ff", dir:[ 0.0, 0.85,-0.55], lobe:"lobo parietal"},
  "Outros":           {hex:"#c9cfe6", dir:[ 0.0,-0.55,-0.85], lobe:"cerebelo"}
};
const STATUS = {ativo:"Ativo", pausado:"Pausado", ideia:"Ideia", concluido:"Concluído"};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}};
const daysAgo = iso=>iso?Math.max(0,Math.floor((Date.now()-new Date(iso))/864e5)):null;
const whenTxt = iso=>{const d=daysAgo(iso);if(d===null)return"sem registro";if(d===0)return"hoje";if(d===1)return"ontem";if(d<30)return`há ${d} dias`;const m=Math.round(d/30);return m<12?`há ${m} ${m>1?"meses":"mês"}`:"há mais de 1 ano"};
const areaOf = p=>AREAS[p&&p.area]?p.area:"Outros";
const slug = s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let projects=[], byId={}, selected=null, focusArea=null, db=null, canWrite=false, mood="idle", lastSig="";

/* ================= forma do cérebro ================= */
function gyri(x,y,z){ return 0.045*Math.sin(9*x+3*y)*Math.cos(8*z-2*y) + 0.03*Math.sin(15*y+7*z)*Math.sin(13*x) + 0.02*Math.cos(21*x-17*z+5*y); }
function surf(dx,dy,dz){
  const L=Math.hypot(dx,dy,dz)||1; const x=dx/L,y=dy/L,z=dz/L;
  let r=1+gyri(x,y,z); if(y<-0.15) r*=1-(-0.15-y)*0.35;
  let px=x*r, py=y*r*0.82, pz=z*r*1.22;
  px+=Math.sign(x||1)*0.05; if(Math.abs(x)<0.08&&y>0) py-=0.06;
  return new THREE.Vector3(px,py+0.08,pz);
}
function cerebellum(dx,dy,dz){ const L=Math.hypot(dx,dy,dz)||1; const x=dx/L,y=dy/L,z=dz/L; const r=1+0.05*Math.sin(30*y); return new THREE.Vector3(x*0.52*r,y*0.3*r-0.62,z*0.38*r-0.78); }
function rndDir(){ const u=Math.random()*2-1,t=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u); return [s*Math.cos(t),u,s*Math.sin(t)]; }
function glowTex(){ const c=document.createElement("canvas"); c.width=c.height=64; const g=c.getContext("2d"); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.25,"rgba(255,255,255,.7)"); gr.addColorStop(1,"rgba(255,255,255,0)"); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }

let renderer,scene,camera,controls,brain,nodeGroup,linkGroup,cloud,web,core,tex,clock,pulses=[],nodeMeshes=[],areaHubs={},labels=[];
const V=window.THREE?{a:new THREE.Vector3(),cam:new THREE.Vector3(),n:new THREE.Vector3()}:null;
const COL=window.THREE?{idle:new THREE.Color("#7fd8ff"),listening:new THREE.Color("#9ff4ff"),thinking:new THREE.Color("#b48cff"),speaking:new THREE.Color("#5ff0b0")}:null;

function init(){
  if(!window.THREE){ $("#fallback").hidden=false; return false; }
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"}); }catch(e){ $("#fallback").hidden=false; return false; }
  tex=glowTex(); clock=new THREE.Clock();
  renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<720?1.5:1.75));
  $("#stage").appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,1,0.1,100); camera.position.set(2.6,1.2,3.4);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  Object.assign(controls,{enableDamping:true,dampingFactor:0.06,rotateSpeed:0.6,zoomSpeed:0.7,minDistance:1.8,maxDistance:8,enablePan:false,autoRotate:!reduce,autoRotateSpeed:0.45});
  let idle; controls.addEventListener("start",()=>{flyTo=null;controls.autoRotate=false;clearTimeout(idle)});
  controls.addEventListener("end",()=>{clearTimeout(idle);idle=setTimeout(()=>{if(!reduce&&!selected&&!focusArea)controls.autoRotate=true},7000)});

  brain=new THREE.Group(); scene.add(brain);
  const N=innerWidth<720?5500:8000, pos=new Float32Array(N*3), col=new Float32Array(N*3), cA=new THREE.Color("#5b7cff"), cB=new THREE.Color("#8ff0ff"), tmp=new THREE.Color(), pts=[];
  for(let i=0;i<N;i++){
    const d=rndDir(), inside=Math.random()<0.18?0.55+Math.random()*0.4:1;
    const p=(i<N*0.88?surf(...d):cerebellum(...d)).multiplyScalar(inside);
    pos.set([p.x,p.y,p.z],i*3); pts.push(p);
    tmp.copy(cA).lerp(cB,Math.min(1,Math.max(0,(p.y+0.6)/1.4))); col.set([tmp.r,tmp.g,tmp.b],i*3);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3)); g.setAttribute("color",new THREE.BufferAttribute(col,3));
  cloud=new THREE.Points(g,new THREE.PointsMaterial({size:0.022,map:tex,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  brain.add(cloud);
  const seg=[]; for(let k=0;k<1300;k++){ const a=pts[(Math.random()*pts.length)|0]; let best=null,bd=1e9; for(let t=0;t<40;t++){const b=pts[(Math.random()*pts.length)|0]; const dd=a.distanceToSquared(b); if(dd>0.002&&dd<bd){bd=dd;best=b}} if(best&&bd<0.03) seg.push(a.x,a.y,a.z,best.x,best.y,best.z); }
  const lg=new THREE.BufferGeometry(); lg.setAttribute("position",new THREE.Float32BufferAttribute(seg,3));
  web=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:"#4f7dff",transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false})); brain.add(web);
  const stem=[]; for(let i=0;i<450;i++){ const t=Math.random(),a=Math.random()*6.28,r=0.12*(1-t*0.3); stem.push(Math.cos(a)*r,-0.35-t*0.75,-0.35-t*0.1+Math.sin(a)*r); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute("position",new THREE.Float32BufferAttribute(stem,3));
  brain.add(new THREE.Points(sg,new THREE.PointsMaterial({size:0.02,map:tex,color:"#3f5fd0",transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending})));
  core=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:"#7fd8ff",transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  core.scale.setScalar(0.5); core.position.set(0,0.05,0); brain.add(core);
  linkGroup=new THREE.Group(); nodeGroup=new THREE.Group(); brain.add(linkGroup,nodeGroup);
  addEventListener("resize",resize); resize(); setupPointer(); requestAnimationFrame(animate);
  return true;
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.fov=w<720?58:42; camera.updateProjectionMatrix(); }

/* ================= neurônios dos projetos ================= */
function groups(){ const g={}; projects.forEach(p=>{(g[areaOf(p)]=g[areaOf(p)]||[]).push(p)}); return g; }
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function disposeGroup(gr){ [...gr.children].forEach(c=>{ gr.remove(c); c.geometry&&c.geometry.dispose(); c.material&&c.material.dispose(); }); }

function buildNodes(){
  if(!nodeGroup) return;
  disposeGroup(nodeGroup); disposeGroup(linkGroup);
  nodeMeshes=[]; pulses=[]; areaHubs={}; $("#labels").innerHTML=""; labels=[];
  const coreP=new THREE.Vector3(0,0.05,0), gray=new THREE.Color("#7c86a8");
  Object.entries(groups()).forEach(([area,list])=>{
    const A=AREAS[area], color=new THREE.Color(A.hex), surfP=surf(...A.dir), hub=surfP.clone().multiplyScalar(0.62);
    areaHubs[area]={pos:surfP.clone()};
    const hs=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
    hs.scale.setScalar(0.28); hs.position.copy(hub); nodeGroup.add(hs);
    addCurve(coreP,hub,color,0.22,true);
    addLabel({area,pos:hub,cls:"area",text:area});
    const base=new THREE.Vector3(...A.dir).normalize();
    const t1=new THREE.Vector3().crossVectors(base,new THREE.Vector3(0,1,0.001)).normalize(), t2=new THREE.Vector3().crossVectors(base,t1).normalize();
    list.forEach((p,j)=>{
      const n=list.length, ang=(j/n)*Math.PI*2+(hash(p.id)%100)/100, spread=n>1?0.18+0.05*Math.min(n,5):0;
      const dir=base.clone().addScaledVector(t1,Math.cos(ang)*spread).addScaledVector(t2,Math.sin(ang)*spread);
      const pos=surf(dir.x,dir.y,dir.z).multiplyScalar(1.04);
      const d=daysAgo(p.last_activity), hot=d!==null&&d<=7, faded=p.status==="pausado"||p.status==="concluido";
      const c=faded?color.clone().lerp(gray,0.55):color, size=hot?0.2:d!==null&&d<=30?0.15:0.12;
      const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:c,transparent:true,opacity:faded?.55:1,blending:THREE.AdditiveBlending,depthWrite:false}));
      glow.scale.setScalar(size*1.3); glow.position.copy(pos); nodeGroup.add(glow);
      const m=new THREE.Mesh(new THREE.SphereGeometry(size*0.22,14,14),new THREE.MeshBasicMaterial({color:new THREE.Color("#ffffff").lerp(c,0.35),transparent:true}));
      m.position.copy(pos); m.userData={id:p.id,area,glow,hot,faded,base:size*(hot?1.6:1.3),cur:size*1.3,phase:Math.random()*6}; nodeGroup.add(m); nodeMeshes.push(m);
      addCurve(hub,pos,c,faded?0.18:0.4,!faded);
      addLabel({id:p.id,area,pos,cls:"",text:p.name,color:A.hex});
    });
  });

}
function addCurve(a,b,color,op,pulse){
  const mid=a.clone().add(b).multiplyScalar(0.56); const curve=new THREE.QuadraticBezierCurve3(a.clone(),mid,b.clone());
  linkGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(28)),new THREE.LineBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false})));
  if(pulse&&!reduce){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})); s.scale.setScalar(0.07); linkGroup.add(s); pulses.push({s,curve,t:Math.random(),v:0.25+Math.random()*0.35}); }
}
function addLabel(o){ const el=document.createElement("div"); el.className="lbl hide "+o.cls; el.textContent=o.text; el.style.setProperty("--c",o.color||AREAS[o.area].hex); $("#labels").appendChild(el); labels.push({...o,el,shown:false}); }

let hover=null, downAt=null, flyTo=null;
const ray=window.THREE?new THREE.Raycaster():null, mouse=window.THREE?new THREE.Vector2():null;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  let best=null,bd=(ev.pointerType==="touch"?30:20)**2;
  nodeMeshes.forEach(m=>{ V.a.copy(m.position).applyMatrix4(brain.matrixWorld).project(camera); if(V.a.z>1) return; const x=(V.a.x+1)/2*r.width,y=(1-V.a.y)/2*r.height,d=(x-mx)**2+(y-my)**2; if(d<bd){bd=d;best=m} });
  return best;
}
function setupPointer(){
  const c=renderer.domElement;
  c.addEventListener("pointermove",ev=>{
    if(ev.pointerType!=="mouse") return;
    const m=pick(ev); hover=m; c.style.cursor=m?"pointer":"grab";
    const tip=$("#tip"), p=m&&byId[m.userData.id];
    if(p){ tip.innerHTML=`<b>${esc(p.name)}</b><span>${esc(STATUS[p.status]||"")} · ${whenTxt(p.last_activity)}</span>`; tip.hidden=false; tip.style.left=(ev.clientX+14)+"px"; tip.style.top=(ev.clientY+14)+"px"; }
    else tip.hidden=true;
  });
  c.addEventListener("pointerleave",()=>{hover=null;$("#tip").hidden=true});
  c.addEventListener("pointerdown",ev=>{downAt=[ev.clientX,ev.clientY]});
  c.addEventListener("pointerup",ev=>{ if(!downAt||Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1])>6) return; const m=pick(ev); if(m) select(m.userData.id); else if(selected) select(null); });
}
function flyToward(worldPos,dist){ const w=worldPos.clone(); flyTo={target:w.clone().multiplyScalar(0.35),cam:w.clone().normalize().multiplyScalar(dist).add(new THREE.Vector3(0,0.3,0))}; if(controls) controls.autoRotate=false; }
function select(id){

  if(controls){
    if(selected){ const m=nodeMeshes.find(x=>x.userData.id===selected); if(m) flyToward(m.position.clone().applyMatrix4(brain.matrixWorld),3.0); }
    else flyTo={target:new THREE.Vector3(),cam:camera.position.clone().normalize().multiplyScalar(4.4)};
  }

}
function setArea(area){
  focusArea=area||null; selected=null;
  if(controls){ if(focusArea&&areaHubs[focusArea]) flyToward(areaHubs[focusArea].pos.clone().applyMatrix4(brain.matrixWorld),3.3); else { flyTo={target:new THREE.Vector3(),cam:camera.position.clone().normalize().multiplyScalar(4.4)}; if(!reduce) controls.autoRotate=true; } }
  applyFocus(); renderLegend(); renderPanel();
}
function applyFocus(){
  const selArea=selected?areaOf(byId[selected]):focusArea;
  nodeMeshes.forEach(m=>{ const on=!selArea||m.userData.area===selArea; m.material.opacity=on?1:.2; m.userData.glow.material.opacity=on?(m.userData.faded?.55:1):.12; });
  labels.forEach(l=>l.el.classList.toggle("sel",!!l.id&&l.id===selected));
}

/* ================= loop de animação ================= */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(flyTo){ const k=1-Math.pow(0.02,dt); controls.target.lerp(flyTo.target,k); camera.position.lerp(flyTo.cam,k); if(camera.position.distanceTo(flyTo.cam)<0.01) flyTo=null; }
  controls.update();
  const speed={idle:1,listening:1.3,thinking:3.2,speaking:1.8}[mood];
  pulses.forEach(p=>{ p.t=(p.t+dt*p.v*speed)%1; p.s.position.copy(p.curve.getPoint(p.t)); });
  nodeMeshes.forEach(m=>{ const u=m.userData, k=u.id===selected?1.8:(m===hover?1.4:1), beat=u.hot&&!reduce?1+0.18*Math.sin(t*4+u.phase):1, target=u.base*k*beat; u.cur+=(target-u.cur)*Math.min(1,dt*10); u.glow.scale.setScalar(u.cur); });
  // o cérebro reage à conversa
  const cc=COL[mood]; core.material.color.lerp(cc,Math.min(1,dt*4));
  let co=.5, cs=.5;
  if(!reduce){
    if(mood==="idle"){ co=.45+.12*Math.sin(t*1.6); }
    else if(mood==="listening"){ co=.65+.25*Math.sin(t*5); cs=.65+.08*Math.sin(t*5); }
    else if(mood==="thinking"){ co=.7+.25*Math.sin(t*11); cs=.7; }
    else { co=.6+.35*Math.abs(Math.sin(t*9)); cs=.6+.2*Math.abs(Math.sin(t*9)); }
  }
  core.material.opacity=co; core.scale.setScalar(core.scale.x+(cs-core.scale.x)*Math.min(1,dt*8));
  web.material.opacity=mood==="thinking"?.28+.1*Math.sin(t*8):mood==="idle"?.16:.22;
  renderer.render(scene,camera);
  // rótulos
  const w=innerWidth,h=innerHeight, camDist=camera.position.distanceTo(controls.target)+controls.target.length(), selArea=selected?areaOf(byId[selected]):focusArea;
  V.cam.copy(camera.position).normalize();
  for(const l of labels){
    V.a.copy(l.pos).applyMatrix4(brain.matrixWorld);
    const facing=V.n.copy(V.a).normalize().dot(V.cam);
    V.a.project(camera);
    const show=V.a.z<1&&(l.cls==="area"?facing>-0.2:(facing>0.15&&(camDist<3.6||l.id===selected||(selArea&&l.area===selArea)||(hover&&hover.userData.id===l.id))));
    if(show!==l.shown){ l.el.classList.toggle("hide",!show); l.shown=show; }
    if(show) l.el.style.transform=`translate(${((V.a.x+1)/2*w).toFixed(1)}px,${((1-V.a.y)/2*h).toFixed(1)}px) translate(-50%,-150%)`;
  }
}

${resumo||"(nenhum)"}`;

async function ask(text){
  text=String(text||"").trim(); if(!text) return;
  if(busy){ abortCtl&&abortCtl.abort(); }
  if(!sample){ say("O assistente não está disponível aqui. Abra o cérebro pelo claude.ai num navegador."); return; }
  busy=true; setMood("thinking"); $("#said").textContent="“"+text+"”"; $("#answer").textContent="…";
  history.push({role:"user",content:text}); history=history.slice(-12); while(history.length&&history[0].role!=="user") history.shift();
  const msgs=history.map((m,i)=>i===history.length-1?{role:"user",content:systemText()+"\n\nLucas disse: "+m.content}:m);
  abortCtl=new AbortController(); const myCtl=abortCtl;
  let reply="";
  try{
    const r=await sample(msgs,{tools:TOOLS,modelTier:"default",cache:false,signal:myCtl.signal,onText:({text})=>{ if(myCtl===abortCtl) $("#answer").textContent=text; }});
    reply=(r.text||"").trim()||"Feito.";
  }catch(e){
    if(myCtl!==abortCtl) return;
    reply=e&&e.code==="rate_limited"?"Muitos pedidos seguidos. Me dá uns segundos.":e&&e.code==="not_granted"?"Você não liberou o assistente pra esta página. Dá pra liberar no menu de permissões do artefato.":"Não consegui responder agora. Tenta de novo.";
  }
  if(myCtl!==abortCtl) return;
  busy=false; history.push({role:"assistant",content:reply}); say(reply);
}
function say(text){

  setMood("speaking");
  tts.speak(text.slice(0,1900),{voice:"rounded",language:"pt-BR",rate:1.08}).catch(()=>{}).finally(()=>{ if(mood==="speaking") setMood("idle"); });
}
function listen(){
  if(!dict){ $("#askIn").focus(); if(!$("#answer").dataset.warned){ $("#answer").dataset.warned="1"; $("#answer").textContent="O microfone só funciona no Chrome/Edge ou no app do Claude no computador. Aqui, digite o comando."; } return; }
  if(dict.active()){ dict.stop().catch(()=>{}); return; }
  if(tts){ try{tts.stop()}catch{} }
  if(busy&&abortCtl){ abortCtl.abort(); busy=false; }
  heard=""; $("#said").textContent=""; $("#answer").textContent="Ouvindo…"; setMood("listening");
  dict.start({language:"pt-BR"}).catch(e=>{ setMood("idle"); $("#answer").textContent=e&&e.code==="not_granted"?"O microfone foi bloqueado. Libere no menu de permissões ou digite o comando.":"Não consegui abrir o microfone. Tenta de novo ou digite."; });
}
function armSilence(){ clearTimeout(silence); silence=setTimeout(()=>{ if(dict&&dict.active()) dict.stop().catch(()=>{}); },1500); }
$("#orb").addEventListener("click",listen);
$("#ask").addEventListener("submit",e=>{ e.preventDefault(); const v=$("#askIn").value; $("#askIn").value=""; if(tts){try{tts.stop()}catch{}} ask(v); });
document.addEventListener("keydown",e=>{
  const typing=e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]");
  if(e.code==="Space"&&!typing&&!e.repeat){ e.preventDefault(); listen(); }
  if(e.key==="Escape"){ if(dict&&dict.active()) dict.stop().catch(()=>{}); if(tts){try{tts.stop()}catch{}} pendingDelete=null; setArea(null); }
});

/* ================= início ================= */
function setLive(on,txt){ $("#live").classList.toggle("on",on); $("#liveTxt").textContent=txt; }
setMood("idle");
init(); refresh();
(async()=>{
  const timer=setTimeout(()=>setLive(false,"sem conexão com o banco"),10000);
  const c=window.claude;
  if(!c||!c.use){ clearTimeout(timer); setLive(false,"abra pelo claude.ai pra ver ao vivo"); return; }
  c.use("dictation").then(d=>{ dict=d; if(!d) return;
    d.onPartial(({text})=>{ $("#said").textContent=(heard+" "+text).trim(); armSilence(); });
    d.onFinal(({text})=>{ heard=(heard+" "+text).trim(); $("#said").textContent=heard; armSilence(); });
    d.onState(({state})=>{ if(state==="listening") setMood("listening"); if(state==="idle"){ clearTimeout(silence); const h=heard; heard=""; if(h) ask(h); else if(mood==="listening"){ setMood("idle"); $("#answer").textContent="Não ouvi nada. Toque no orbe e fale."; } } });
  });
  c.use("tts").then(t=>{ tts=t; if(!t) $("#mute").hidden=true; });
  c.use("sample").then(s=>{ sample=s; });
  db=await c.use("db"); const user=await c.use("user");
  if(!db){ clearTimeout(timer); setLive(false,"entre no claude.ai pra ver ao vivo"); return; }
  canWrite=user?await user.canEdit():false; renderPanel();
  db.collection("projects").onSnapshot(snap=>{
    clearTimeout(timer);
    projects=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
    if(selected&&!projects.some(p=>p.id===selected)) selected=null;
    setLive(true,"ao vivo · "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    refresh();
  },()=>{ clearTimeout(timer); setLive(false,"conexão perdida, recarregue a página"); });
})();
</script>
